<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lissajous Figure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">Canvas Experiment</p>
      <h1>Lissajous Figure</h1>
      <p class="subtitle">Change the frequencies and phase to reshape the curve.</p>
    </header>

    <section class="controls">
      <div class="control">
        <div class="control-row">
          <label for="freqX">Frequency X</label>
          <output id="freqXValue">3.0</output>
        </div>
        <input id="freqX" type="range" min="1" max="10" value="3" step="0.1">
      </div>

      <div class="control">
        <div class="control-row">
          <label for="freqY">Frequency Y</label>
          <output id="freqYValue">2.0</output>
        </div>
        <input id="freqY" type="range" min="1" max="10" value="2" step="0.1">
      </div>

      <div class="control">
        <div class="control-row">
          <label for="phase">Phase</label>
          <output id="phaseValue">90°</output>
        </div>
        <input id="phase" type="range" min="0" max="360" value="90" step="1">
      </div>

      <div class="control">
        <div class="control-row">
          <label for="amplitudeX">Amplitude X</label>
          <output id="amplitudeXValue">180</output>
        </div>
        <input id="amplitudeX" type="range" min="40" max="220" value="180" step="1">
      </div>

      <div class="control">
        <div class="control-row">
          <label for="amplitudeY">Amplitude Y</label>
          <output id="amplitudeYValue">180</output>
        </div>
        <input id="amplitudeY" type="range" min="40" max="220" value="180" step="1">
      </div>

      <div class="control">
        <div class="control-row">
          <label for="speed">Animation Speed</label>
          <output id="speedValue">0.8</output>
        </div>
        <input id="speed" type="range" min="0.1" max="2" value="0.8" step="0.1">
      </div>

      <div class="control">
        <div class="control-row">
          <label for="lineWidth">Line Width</label>
          <output id="lineWidthValue">2.0</output>
        </div>
        <input id="lineWidth" type="range" min="1" max="8" value="2" step="0.5">
      </div>

      <div class="control color-control">
        <div class="control-row">
          <label for="lineColor">Line Color</label>
          <output id="lineColorValue">#1a73e8</output>
        </div>
        <input id="lineColor" type="color" value="#1a73e8">
      </div>

      <button id="resetButton" type="button">Reset values</button>
    </section>

    <section class="stage">
      <div class="stage-head">
        <span>Animated preview</span>
        <span>520 × 520</span>
      </div>
      <canvas id="lissajousCanvas" width="520" height="520"></canvas>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
